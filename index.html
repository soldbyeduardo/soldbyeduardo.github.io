<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Eduardo Garza | RGV Realtor</title>
  <meta name="description" content="Eduardo Garza — RGV Realtor. Buying or selling in the Rio Grande Valley? Let's connect.">
  <meta property="og:title" content="Eduardo Garza | RGV Realtor">
  <meta property="og:description" content="RGV Realtor | Contact me">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #071634;  /* Stellar Navy – Primary */
      --navy-2:    #1F2942;  /* Slate Navy – Secondary */
      --bg:        #F4F3F2;  /* Soft White – Page background */
      --white:     #FFFFFF;
      --gray-lt:   #D3D1D2;  /* Architectural Gray */
      --gray-mid:  #ABA6A9;  /* Concrete Gray */
      --graphite:  #585761;  /* Graphite */
      --slate:     #777985;  /* Steel Slate */
      --text:      #071634;
      --muted:     #777985;
      --border:    rgba(7,22,52,.15);
      --radius:    14px;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 env(safe-area-inset-bottom, 32px);
    }

    /* ── container ── */
    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── navy hero ── */
    .hero {
      width: 100%;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(32px, env(safe-area-inset-top, 32px)) 24px 28px;
      position: relative;
    }

    /* ── language toggle ── */
    .lang-toggle {
      position: absolute;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: 16px;
      display: flex;
      gap: 0;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px;
      overflow: hidden;
    }
    .lang-toggle button {
      background: none;
      border: none;
      color: rgba(255,255,255,.55);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      padding: 6px 12px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .lang-toggle button.active {
      background: var(--white);
      color: var(--navy);
    }
    .lang-toggle button:not(.active):hover {
      color: var(--white);
    }

    /* ── body section ── */
    .body-section {
      width: 100%;
      background: var(--bg);
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── profile photo ── */
    .avatar-wrap {
      position: relative;
      width: 108px;
      height: 108px;
      margin-bottom: 16px;
    }
    .avatar-wrap::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--white), var(--gray-lt));
      z-index: 0;
    }
    .avatar {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: var(--navy-2);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--navy);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }
    .avatar .initials {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: .04em;
      user-select: none;
    }

    /* ── identity ── */
    .handle {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: .02em;
      margin-bottom: 6px;
      text-align: center;
    }
    .tagline {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,.65);
      letter-spacing: .06em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 14px;
    }
    .phone-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--white);
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: .03em;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.3);
      transition: background .15s, border-color .15s;
    }
    .phone-link:hover {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.6);
    }
    .phone-link svg { flex-shrink: 0; }
    .phone-link-inner { display: flex; flex-direction: column; gap: 2px; }
    .phone-number { font-size: 17px; font-weight: 600; }
    .phone-methods { font-size: 11px; font-weight: 400; color: rgba(255,255,255,.55); letter-spacing: .05em; text-transform: uppercase; }

    /* ── divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: var(--gray-lt);
      margin: 4px 0 20px;
    }

    /* ── social icons ── */
    .socials {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      color: var(--navy);
      background: var(--white);
      text-decoration: none;
      transition: background .15s, border-color .15s, transform .12s;
      box-shadow: 0 1px 4px rgba(7,22,52,.08);
    }
    .social-link:hover {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
      transform: translateY(-2px);
    }
    .social-link svg { width: 20px; height: 20px; }

    /* ── buttons ── */
    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 12px;
    }
    .btn-group + .btn-group {
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--navy);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      text-decoration: none;
      transition: background .18s, border-color .18s, color .18s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(7,22,52,.07);
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--navy);
      opacity: 0;
      transition: opacity .18s;
    }
    .btn:hover { border-color: var(--navy); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(7,22,52,.15); }
    .btn:hover::before { opacity: 1; }
    .btn:hover .btn-label .main,
    .btn:hover .btn-label .sub,
    .btn:hover .btn-icon { color: var(--white); }
    .btn:active { transform: translateY(0); }

    .btn.btn-primary {
      border-color: rgba(201,168,76,.4);
    }
    .btn.btn-primary:hover {
      border-color: var(--gold);
    }

    .btn-label {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .btn-label .main {
      font-size: 16px;
      font-weight: 600;
      color: var(--navy);
      position: relative;
      z-index: 1;
      transition: color .18s;
    }
    .btn-label .sub {
      font-size: 12px;
      font-weight: 400;
      color: var(--slate);
      position: relative;
      z-index: 1;
      transition: color .18s;
    }
    .btn-icon {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      color: var(--slate);
      transition: color .18s;
    }
    .btn-icon svg { width: 18px; height: 18px; display: block; }

    /* ── footer ── */
    .footer {
      margin-top: 32px;
      font-size: 11px;
      color: var(--gray-mid);
      text-align: center;
      letter-spacing: .04em;
    }
  </style>
</head>

<script>
  function handleBtn(btn, url) {
    const action = btn.getAttribute('data-crm-action');
    // ── CRM hook (Phase 2) ──────────────────────────────────────────────────
    // Uncomment and update when the CRM endpoint is live:
    //
    // fetch('https://YOUR-CRM-URL/api/leads', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify({ source: 'link-in-bio', intent: action })
    // }).then(() => { if (url !== '#') window.location.href = url; });
    //
    // ───────────────────────────────────────────────────────────────────────
    if (url && url !== '#') window.location.href = url;
  }

  function setLang(lang) {
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-es').classList.toggle('active', lang === 'es');
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.dataset[lang];
    });
    try { localStorage.setItem('bio-lang', lang); } catch(e) {}
  }

  // Auto-detect language on load
  (function () {
    let lang = 'en';
    try { lang = localStorage.getItem('bio-lang') || lang; } catch(e) {}
    if (lang === 'en' && navigator.language && navigator.language.startsWith('es')) lang = 'es';
    if (lang !== 'en') setLang(lang);
  })();
</script>
